services:
  dimensionador-kubernetes:
    build:
      context: .
      dockerfile: Dockerfile
    image: dimensionador-kubernetes-on-premise:1.0.0
    container_name: dimensionador-kubernetes
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
