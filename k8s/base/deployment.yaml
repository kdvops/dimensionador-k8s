apiVersion: apps/v1
kind: Deployment
metadata:
  name: dimensionador-k8s
  labels:
    app.kubernetes.io/name: dimensionador-k8s
    app.kubernetes.io/part-of: dimensionador-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dimensionador-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dimensionador-k8s
        app.kubernetes.io/part-of: dimensionador-k8s
    spec:
      containers:
        - name: web
          image: ghcr.io/kdvops/dimensionador-k8s:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
